# Dependabot keeps the two supply-chain surfaces this repository actually
# has current: GitHub Actions references and the single Dockerfile base
# image. There is no third-party Python dependency (the bootstrap hook is
# standard-library-only), so no pip ecosystem is configured.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The Dockerfile lives in the image subdirectory, not at the repository
  # root; Dependabot only scans the given directory for Dockerfiles/compose.
  - package-ecosystem: docker
    directory: /deploy/images/nereididentity-bootstrap
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
