#
# Suite login theme. Inheriting the stock Keycloak theme keeps every
# authentication flow and its built-in translations; NereidAI overrides only
# branding, a small stylesheet and the two locale labels.
parent=keycloak
import=common/keycloak
styles=css/login.css css/nereidai.css
locales=en,zh-CN
meta=viewport==width=device-width,initial-scale=1
