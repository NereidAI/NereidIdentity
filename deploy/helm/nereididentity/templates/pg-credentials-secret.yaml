{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Basic-auth Secret consumed by the CNPG Cluster initdb bootstrap and by the
Keycloak subchart (keycloak.database.existingSecret). The password is
operator-supplied at deploy time through postgresql.bootstrap.password.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $initdb := .Values.postgresql.cluster.bootstrap.initdb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $initdb.secret.name }}
  labels:
    {{- include "nereididentity.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $initdb.owner | quote }}
  password: {{ required "postgresql.bootstrap.password is required" .Values.postgresql.bootstrap.password | quote }}
{{- end }}
