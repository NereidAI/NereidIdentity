{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Render the suite realm as Keycloak's full RealmRepresentation JSON. The
nereidsphere client is the NS login RP (mandatory); each product client
exists for the optional direct-to-NI OIDC mode (in the default suite
deployment products trust NS tickets and never use these clients). Keycloak
imports the file on startup from /opt/keycloak/data/import (see
keycloak.extraVolumes in values.yaml); an existing realm is not overwritten.
*/ -}}
{{- $id := .Values.identity -}}
{{- $defaultScopes := list "web-origins" "roles" "profile" "email" "groups" -}}
{{- $optionalScopes := list "address" "phone" "offline_access" "microprofile-jwt" -}}
{{- $clients := list -}}
{{- range $clientID, $c := $id.clients -}}
{{- $secret := required (printf "identity.clients.%s.secret is required" $clientID) $c.secret -}}
{{- $attrs := dict "pkce.code.challenge.method" "S256" -}}
{{- if eq $clientID "nereidsphere" -}}
{{- $_ := set $attrs "post.logout.redirect.uris" (index $c.webOrigins 0) -}}
{{- end -}}
{{- $clients = append $clients (dict
    "clientId" $clientID
    "name" $c.name
    "description" $c.description
    "enabled" true
    "clientAuthenticatorType" "client-secret"
    "secret" $secret
    "redirectUris" $c.redirectUris
    "webOrigins" $c.webOrigins
    "bearerOnly" false
    "consentRequired" false
    "standardFlowEnabled" true
    "implicitFlowEnabled" false
    "directAccessGrantsEnabled" $c.directAccessGrants
    "serviceAccountsEnabled" false
    "publicClient" false
    "frontchannelLogout" true
    "protocol" "openid-connect"
    "attributes" $attrs
    "fullScopeAllowed" true
    "defaultClientScopes" $defaultScopes
    "optionalClientScopes" $optionalScopes
  ) -}}
{{- end -}}
{{- /*
  Service-account client for the NereidSphere admin console (topology A only).
  NS calls the Keycloak Admin REST API with client-credentials; the linked
  service-account user carries the realm admin role.
*/ -}}
{{- /*
  Service-account client for the NereidSphere admin console (topology A only).
  NS calls the Keycloak Admin REST API with client-credentials; the linked
  service-account user receives the realm-management/realm-admin role from the
  post-install bootstrap hook. fullScopeAllowed plus the default "roles" scope
  are mandatory: without them Keycloak strips realm_access/resource_access from
  the client-credentials token and every Admin API call returns 403.
*/ -}}
{{- $adminClientID := $id.adminClient.clientId -}}
{{- $adminSecret := required "identity.adminClient.secret is required" $id.adminClient.secret -}}
{{- /*
  Suite admin password: an explicit value wins; otherwise reuse the password
  already stored in the live Secret (so upgrades never rotate it), generating
  one only on first install. lookup data is base64 encoded.
*/ -}}
{{- $suiteAdminPassword := $id.suiteAdmin.password -}}
{{- if not $suiteAdminPassword -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "nereididentity-realm" -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "suite-admin-password") -}}
{{- $suiteAdminPassword = index $existingSecret.data "suite-admin-password" | b64dec -}}
{{- else -}}
{{- $suiteAdminPassword = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $clients = append $clients (dict
    "clientId" $adminClientID
    "name" "NereidSphere Admin Console"
    "description" "Service account for NereidSphere identity administration (client-credentials, realm-admin)"
    "enabled" true
    "clientAuthenticatorType" "client-secret"
    "secret" $adminSecret
    "redirectUris" (list)
    "webOrigins" (list)
    "bearerOnly" false
    "consentRequired" false
    "standardFlowEnabled" false
    "implicitFlowEnabled" false
    "directAccessGrantsEnabled" false
    "serviceAccountsEnabled" true
    "publicClient" false
    "frontchannelLogout" false
    "protocol" "openid-connect"
    "fullScopeAllowed" true
    "defaultClientScopes" (list "roles")
    "optionalClientScopes" (list)
  ) -}}
{{- /*
  Keycloak auto-creates the service-account user when the client is imported,
  but a realm import cannot grant roles onto that user; the post-install
  bootstrap hook performs the idempotent realm-admin binding instead.
*/ -}}
{{- /*
  Realm-level 'groups' client scope. Keycloak 26 has no built-in groups
  scope, so the import declares one with the full-path group-membership
  mapper and binds it as a default scope on the SSO clients above; the
  post-upgrade hook reconciles the same state on realms already imported.
*/ -}}
{{- $groupsScope := dict
  "name" "groups"
  "protocol" "openid-connect"
  "attributes" (dict "include.in.token.scope" "true" "display.on.consent.screen" "false")
  "protocolMappers" (list (dict
    "name" "groups"
    "protocol" "openid-connect"
    "protocolMapper" "oidc-group-membership-mapper"
    "consentRequired" false
    "config" (dict
      "claim.name" "groups"
      "full.path" "true"
      "id.token.claim" "true"
      "access.token.claim" "true"
      "userinfo.token.claim" "true")))
-}}
{{- $realm := dict
    "realm" $id.realm
    "enabled" true
    "displayName" "NereidAI"
    "loginTheme" $id.login.theme
    "internationalizationEnabled" true
    "supportedLocales" $id.login.supportedLocales
    "defaultLocale" $id.login.defaultLocale
    "registrationAllowed" false
    "loginWithEmailAllowed" true
    "duplicateEmailsAllowed" false
    "resetPasswordAllowed" true
    "editUsernameAllowed" false
    "bruteForceProtected" true
    "permanentLockout" false
    "defaultRoles" (list "offline_access" "uma_authorization" "user")
    "roles" (dict "realm" (list
      (dict "name" "user" "description" "Basic user" "composite" false "clientRole" false "containerId" $id.realm)
      (dict "name" "admin" "description" "Administrator" "composite" false "clientRole" false "containerId" $id.realm)
      (dict "name" "operator" "description" "Operator" "composite" false "clientRole" false "containerId" $id.realm)
    ))
    "defaultGroups" (list "user")
    "clientScopes" (list $groupsScope)
    "clients" $clients
  -}}
{{- $users := list -}}
{{- if $id.seedUsers -}}
{{- $users = concat $users (list
    (dict "username" "admin" "enabled" true "totp" false "emailVerified" true
      "firstName" "Admin" "lastName" "User" "email" "admin@nereidai.local"
      "credentials" (list (dict "type" "password" "value" "admin" "temporary" false))
      "realmRoles" (list "admin" "user"))
    (dict "username" "user" "enabled" true "totp" false "emailVerified" true
      "firstName" "Test" "lastName" "User" "email" "user@nereidai.local"
      "credentials" (list (dict "type" "password" "value" "user" "temporary" false))
      "realmRoles" (list "user"))
  ) -}}
{{- end -}}
{{- $_ := set $realm "users" $users -}}
apiVersion: v1
kind: Secret
metadata:
  name: nereididentity-realm
  labels:
    {{- include "nereididentity.labels" . | nindent 4 }}
type: Opaque
stringData:
  nereidai-realm.json: |
{{ toJson $realm | indent 4 }}
  admin-client-secret: {{ $adminSecret | quote }}
  suite-admin-password: {{ $suiteAdminPassword | quote }}
