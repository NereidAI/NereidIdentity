{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Keycloak master administrator credentials, consumed on first engine start via
KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD (see keycloak.extraEnvFrom in
values.yaml). On a realm that was already initialized these variables are
ignored by the engine.
*/ -}}
{{- $adminPassword := required "identity.admin.password is required" .Values.identity.admin.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: nereididentity-admin
  labels:
    {{- include "nereididentity.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ required "identity.admin.username is required" .Values.identity.admin.username | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ $adminPassword | quote }}
